<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Sản Phẩm Mới - WebBanHang</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }
        .btn {
            border-radius: 8px;
            font-weight: 500;
        }
        .form-control, .form-select {
            border-radius: 8px;
            padding: 0.65rem 0.9rem;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/products}">
                <i class="bi bi-shop me-2"></i>WebBanHang
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active fw-bold" th:href="@{/products}">Sản Phẩm</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/categories}">Danh Mục</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-2" style="max-width: 680px;">
        <div class="card p-4">
            <div class="d-flex align-items-center mb-4">
                <a th:href="@{/products}" class="btn btn-outline-secondary btn-sm me-3">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <div>
                    <h3 class="fw-bold mb-0">Thêm Sản Phẩm Mới</h3>
                    <p class="text-muted small mb-0">Nhập thông tin sản phẩm và liên kết với danh mục</p>
                </div>
            </div>

            <!-- Cảnh báo nếu chưa có danh mục -->
            <div th:if="${#lists.isEmpty(categories)}" class="alert alert-warning d-flex align-items-center mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill fs-4 me-3"></i>
                <div>
                    Hiện chưa có danh mục nào trong hệ thống! 
                    <a th:href="@{/categories/add}" class="alert-link">Tạo danh mục trước</a> để phân loại sản phẩm.
                </div>
            </div>

            <form th:action="@{/products/add}" th:object="${product}" method="post">
                <!-- Tên sản phẩm -->
                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">Tên Sản Phẩm <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="name" th:field="*{name}" 
                           placeholder="Ví dụ: Laptop Dell Inspiron 15, iPhone 15 Pro..." required autofocus>
                </div>

                <!-- Đơn giá -->
                <div class="mb-3">
                    <label for="price" class="form-label fw-semibold">Đơn Giá (VNĐ) <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <input type="number" step="any" min="0" class="form-control" id="price" th:field="*{price}" 
                               placeholder="Ví dụ: 15000000" required>
                        <span class="input-group-text">₫</span>
                    </div>
                </div>

                <!-- Chọn danh mục liên kết -->
                <div class="mb-3">
                    <label for="category" class="form-label fw-semibold">Danh Mục <span class="text-danger">*</span></label>
                    <select class="form-select" id="category" th:field="*{category}" required>
                        <option value="" disabled selected>-- Chọn danh mục sản phẩm --</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                    </select>
                </div>

                <!-- Mô tả sản phẩm -->
                <div class="mb-3">
                    <label for="description" class="form-label fw-semibold">Mô Tả Sản Phẩm</label>
                    <textarea class="form-control" id="description" th:field="*{description}" rows="4" 
                              placeholder="Nhập thông tin chi tiết, thông số kỹ thuật, bảo hành..."></textarea>
                </div>

                <!-- Nút thao tác -->
                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a th:href="@{/products}" class="btn btn-light px-4">Hủy Bỏ</a>
                    <button type="submit" class="btn btn-primary px-4 d-inline-flex align-items-center gap-2">
                        <i class="bi bi-check2-circle"></i> Thêm Sản Phẩm
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
