<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh Sửa Danh Mục - WebBanHang</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }
        .btn {
            border-radius: 8px;
            font-weight: 500;
        }
        .form-control {
            border-radius: 8px;
            padding: 0.65rem 0.9rem;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/products}">
                <i class="bi bi-shop me-2"></i>WebBanHang
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/products}">Sản Phẩm</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-bold" th:href="@{/categories}">Danh Mục</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-2" style="max-width: 600px;">
        <div class="card p-4">
            <div class="d-flex align-items-center mb-4">
                <a th:href="@{/categories}" class="btn btn-outline-secondary btn-sm me-3">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <h3 class="fw-bold mb-0">Chỉnh Sửa Danh Mục</h3>
            </div>

            <form th:action="@{/categories/update/{id}(id=${category.id})}" th:object="${category}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted">ID Danh Mục</label>
                    <input type="text" class="form-control bg-light" th:value="${category.id}" readonly disabled>
                </div>

                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">Tên Danh Mục <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="name" th:field="*{name}" 
                           placeholder="Nhập tên danh mục..." required autofocus>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a th:href="@{/categories}" class="btn btn-light px-4">Hủy Bỏ</a>
                    <button type="submit" class="btn btn-primary px-4 d-inline-flex align-items-center gap-2">
                        <i class="bi bi-check2-circle"></i> Cập Nhật
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
