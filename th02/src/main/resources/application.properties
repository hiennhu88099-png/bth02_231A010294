spring.application.name=th02

# ===============================================
# CẤU HÌNH KẾT NỐI MYSQL (LARAGON)
# ===============================================
# Cổng 3307 (Laragon đang chạy trên cổng 3307)
spring.datasource.url=jdbc:mysql://localhost:3307/WebBanHang?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================================
# CẤU HÌNH HIBERNATE / SPRING DATA JPA
# ===============================================
# Tự động tạo / cập nhật bảng theo Entity khi chạy ứng dụng
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================================
# CẤU HÌNH SERVER PORT
# ===============================================
server.port=9999

